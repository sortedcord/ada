server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Docker Compose can replace the API container with a new IP. Resolve the
  # service name periodically instead of pinning the address at Nginx startup.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream api:3000;

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
  location /health/ { proxy_pass http://$api_upstream; }
  location / { try_files $uri $uri/ /index.html; }
  location = /health/live { add_header Content-Type text/plain; return 200 'ok\n'; }
}
